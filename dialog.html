<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
  background: #fff;
  user-select: none;
  overflow: hidden;
  height: 100vh;
  display: flex;
  flex-direction: column;
  border-radius: 12px;
  overflow: hidden;
}

/* 顶部危险条 */
.top-bar {
  height: 4px;
  background: linear-gradient(90deg, #dc2626 0%, #ef4444 50%, #dc2626 100%);
  flex-shrink: 0;
}

/* 标题栏 */
.titlebar {
  -webkit-app-region: drag;
  height: 40px;
  display: flex;
  justify-content: flex-end;
  align-items: center;
  padding: 0 12px 0 20px;
  flex-shrink: 0;
  background: linear-gradient(180deg, #fff5f5 0%, #ffffff 100%);
  border-bottom: 1px solid #fee2e2;
}

.titlebar-label {
  -webkit-app-region: drag;
  flex: 1;
  font-size: 11.5px;
  font-weight: 600;
  color: #dc2626;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 6px;
}

.titlebar-label::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #dc2626;
  box-shadow: 0 0 8px rgba(220, 38, 38, 0.7);
  animation: pulse-dot 1.6s ease-in-out infinite;
}

@keyframes pulse-dot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(0.7); }
}

.close-btn {
  -webkit-app-region: no-drag;
  width: 26px;
  height: 26px;
  border-radius: 6px;
  border: none;
  background: transparent;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #9ca3af;
  transition: all 0.15s;
}
.close-btn:hover { background: #fee2e2; color: #dc2626; }

/* 内容区 */
.content {
  padding: 22px 32px 8px;
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
}

/* 图标（带脉动光晕） */
.icon-wrap {
  width: 68px;
  height: 68px;
  border-radius: 50%;
  background: linear-gradient(135deg, #fee2e2 0%, #fecaca 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 18px;
  position: relative;
  flex-shrink: 0;
}

.icon-wrap::before {
  content: "";
  position: absolute;
  inset: -8px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(239, 68, 68, 0.25) 0%, transparent 70%);
  animation: pulse-ring 2s ease-in-out infinite;
}

@keyframes pulse-ring {
  0%, 100% { transform: scale(1); opacity: 0.6; }
  50% { transform: scale(1.15); opacity: 0.2; }
}

.icon-wrap svg { position: relative; z-index: 1; }

/* 标题 */
.title {
  font-size: 19px;
  font-weight: 700;
  color: #7f1d1d;
  text-align: center;
  margin-bottom: 8px;
  letter-spacing: 0.3px;
}

.subtitle {
  font-size: 13px;
  color: #6b7280;
  text-align: center;
  margin-bottom: 20px;
  line-height: 1.55;
}

/* 命令卡片 */
.details {
  background: #fef2f2;
  border: 1px solid #fecaca;
  border-radius: 10px;
  padding: 14px 16px;
  flex-shrink: 1;
  overflow-y: auto;
  max-height: 180px;
  box-shadow: inset 0 1px 2px rgba(239, 68, 68, 0.06);
}

.details::-webkit-scrollbar { width: 6px; }
.details::-webkit-scrollbar-thumb { background: #fca5a5; border-radius: 3px; }
.details::-webkit-scrollbar-track { background: transparent; }

/* 风险项 */
.risk-item {
  padding: 10px 0;
  border-bottom: 1px dashed #fecaca;
}
.risk-item:last-child { border-bottom: none; padding-bottom: 0; }
.risk-item:first-child { padding-top: 0; }

.risk-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 6px;
}
.risk-row:last-child { margin-bottom: 0; }

.risk-label {
  flex-shrink: 0;
  font-family: inherit;
  font-size: 11px;
  font-weight: 600;
  color: #fff;
  background: #6b7280;
  padding: 3px 9px;
  border-radius: 5px;
  letter-spacing: 0.6px;
  margin-top: 1px;
  min-width: 40px;
  text-align: center;
}
.risk-label-warn {
  background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
  box-shadow: 0 2px 6px rgba(239, 68, 68, 0.3);
}

.risk-cmd {
  font-family: "Cascadia Code", "Consolas", "Courier New", monospace;
  font-size: 12.5px;
  color: #7f1d1d;
  background: rgba(255, 255, 255, 0.7);
  padding: 3px 8px;
  border-radius: 5px;
  word-break: break-all;
  line-height: 1.5;
  border: 1px solid rgba(254, 202, 202, 0.6);
}

.risk-desc {
  font-size: 13px;
  color: #991b1b;
  line-height: 1.6;
  font-weight: 500;
}

/* 底部提示 */
.warn-tip {
  margin-top: 16px;
  padding: 10px 14px;
  background: linear-gradient(90deg, #fffbeb 0%, #fef3c7 100%);
  border-left: 3px solid #f59e0b;
  border-radius: 6px;
  font-size: 12px;
  color: #92400e;
  line-height: 1.5;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.warn-tip svg { flex-shrink: 0; }

/* 底部按钮 */
.footer {
  padding: 18px 32px 24px;
  display: flex;
  gap: 12px;
  justify-content: flex-end;
  flex-shrink: 0;
}

.btn {
  font-family: inherit;
  font-size: 13.5px;
  font-weight: 600;
  padding: 10px 24px;
  border-radius: 9px;
  border: none;
  cursor: pointer;
  transition: all 0.18s ease;
  outline: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  letter-spacing: 0.2px;
}

.btn-cancel {
  background: #f3f4f6;
  color: #374151;
  border: 1px solid #e5e7eb;
}
.btn-cancel:hover { background: #e5e7eb; border-color: #d1d5db; }
.btn-cancel:active { transform: scale(0.97); }

.btn-allow {
  background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
  color: #fff;
  box-shadow: 0 3px 12px rgba(239, 68, 68, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.15);
}
.btn-allow:hover {
  transform: translateY(-1px);
  box-shadow: 0 5px 18px rgba(239, 68, 68, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.2);
}
.btn-allow:active {
  transform: translateY(0);
  box-shadow: 0 2px 8px rgba(239, 68, 68, 0.4);
}

/* 键盘提示 */
.kbd-hint {
  position: absolute;
  bottom: 26px;
  left: 32px;
  font-size: 11px;
  color: #9ca3af;
  display: flex;
  gap: 8px;
  align-items: center;
}
.kbd {
  display: inline-block;
  padding: 1px 6px;
  background: #f3f4f6;
  border: 1px solid #d1d5db;
  border-bottom-width: 2px;
  border-radius: 4px;
  font-family: monospace;
  font-size: 10px;
  color: #4b5563;
}
</style>
</head>
<body>
  <div class="top-bar"></div>

  <div class="titlebar">
    <div class="titlebar-label">操作确认</div>
    <button class="close-btn" onclick="respond(false)" aria-label="关闭">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>

  <div class="content">
    <div class="icon-wrap">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
        <line x1="12" y1="9" x2="12" y2="13"/>
        <line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
    </div>

    <div class="title">AI 请求执行危险操作</div>

    <div class="details" id="details">加载中...</div>

    <div class="warn-tip" id="warn-tip" style="display:none;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span id="warn-text"></span>
    </div>
  </div>

  <div class="footer">
    <button class="btn btn-cancel" onclick="respond(false)">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      取消
    </button>
    <button class="btn btn-allow" onclick="respond(true)">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      允许执行
    </button>
  </div>

  <div class="kbd-hint">
    <span><span class="kbd">Esc</span> 取消</span>
    <span><span class="kbd">Enter</span> 确认</span>
  </div>

  <script>
    window.addEventListener("DOMContentLoaded", function() {
      var el = document.getElementById("details");
      var data = (window.dialogAPI && window.dialogAPI.data) || { reasons: [] };
      var reasons = data.reasons || [];
      if (reasons.length === 0) {
        el.textContent = "(无详情)";
        return;
      }
      var html = "";
      for (var i = 0; i < reasons.length; i++) {
        var r = reasons[i];
        var opMatch = r.match(/^操作:\s*([\s\S]*?)\n风险:\s*([\s\S]*)$/);
        if (opMatch) {
          html += '<div class="risk-item">';
          html += '<div class="risk-row"><span class="risk-label">操作</span><code class="risk-cmd">' + escapeHtml(opMatch[1]) + '</code></div>';
          html += '<div class="risk-row"><span class="risk-label risk-label-warn">风险</span><span class="risk-desc">' + escapeHtml(opMatch[2]) + '</span></div>';
          html += '</div>';
        } else {
          html += '<div class="risk-item"><span class="risk-desc">' + escapeHtml(r) + '</span></div>';
        }
      }
      el.innerHTML = html;

      // 动态显示警告（仅当包含删除类操作时）
      var warnTip = document.getElementById("warn-tip");
      var warnText = document.getElementById("warn-text");
      if (warnTip && warnText) {
        var hasDelete = false;
        for (var j = 0; j < reasons.length; j++) {
          if (/\b(del|rm|rmdir|rd)\b/i.test(reasons[j]) || reasons[j].indexOf("删除文件") !== -1 || reasons[j].indexOf("删除目录") !== -1) {
            hasDelete = true;
            break;
          }
        }
        if (hasDelete) {
          warnText.textContent = "删除操作不放入回收站，请确认后继续";
          warnTip.style.display = "flex";
        } else {
          warnTip.style.display = "none";
        }
      }
    });

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function respond(allow) {
      if (window.dialogAPI && window.dialogAPI.respond) {
        window.dialogAPI.respond(allow);
      }
    }

    document.addEventListener("keydown", function(e) {
      if (e.key === "Escape") respond(false);
      if (e.key === "Enter") respond(true);
    });
  </script>
</body>
</html>
