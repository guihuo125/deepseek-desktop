<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<title>操作确认</title>
<link rel="stylesheet" href="themes/claude.css">
<script>
  // 主题桥接：claude.css 的深色段挂在 [data-theme="dark"] 上。
  // 优先用主进程随 loadFile 传来的 ?theme=（那才是应用内设置的档位），
  // 取不到再退回 prefers-color-scheme。这里只翻译成 data-theme 属性，
  // 不写任何色值，也不新增 IPC 通道。
  (function () {
    var fromQuery = "";
    try { fromQuery = new URLSearchParams(location.search).get("theme") || ""; } catch (e) {}
    if (fromQuery === "dark" || fromQuery === "light") {
      document.documentElement.setAttribute("data-theme", fromQuery);
      return;
    }
    try {
      var mq = window.matchMedia("(prefers-color-scheme: dark)");
      var apply = function () {
        document.documentElement.setAttribute("data-theme", mq.matches ? "dark" : "light");
      };
      apply();
      if (mq.addEventListener) mq.addEventListener("change", apply);
      else if (mq.addListener) mq.addListener(apply);
    } catch (e) { /* 取不到就留在浅色，不影响功能 */ }
  })();
</script>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root { color-scheme: light; }
[data-theme="dark"] { color-scheme: dark; }

html, body { height: 100%; }

body {
  font-family: var(--font-ui);
  background: var(--bg-canvas);
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
  user-select: none;
  overflow: hidden;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ===== 标题栏（拖拽区，带极淡的危险底色） ===== */
.titlebar {
  -webkit-app-region: drag;
  height: 40px;
  flex-shrink: 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: var(--space-3);
  padding: 0 var(--space-3) 0 var(--space-5);
  background: var(--danger-soft);
  border-bottom: 1px solid var(--border-default);
}

.titlebar-label {
  -webkit-app-region: drag;
  flex: 1;
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-size: var(--text-xs);
  font-weight: 600;
  color: var(--danger);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

/* 静态圆点：这个窗口可能停留很久，不做常驻脉冲动画 */
.titlebar-label::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--danger);
  flex-shrink: 0;
}

.close-btn {
  -webkit-app-region: no-drag;
  width: 28px;
  height: 28px;
  border-radius: var(--radius-sm);
  border: none;
  background: transparent;
  color: var(--text-tertiary);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background-color var(--dur-fast) var(--ease-out),
              color var(--dur-fast) var(--ease-out);
}
.close-btn:hover { background: var(--bg-subtle); color: var(--text-primary); }
.close-btn:active { background: var(--bg-raised); }
.close-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ===== 卡片 ===== */
.stage {
  flex: 1;
  min-height: 0;
  display: flex;
  padding: var(--space-4);
}

.card {
  flex: 1;
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  background: var(--bg-surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-md);
  /* 入场：轻微上移 + 淡入，只动 transform / opacity，跑一次就结束 */
  animation: card-in var(--dur-base) var(--ease-out) both;
}

@keyframes card-in {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

@keyframes risk-in {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ===== 卡片头部：图标在左、衬线标题在右（横向排布，把纵向空间留给风险详情） ===== */
.card-head {
  flex-shrink: 0;
  display: flex;
  align-items: flex-start;
  gap: var(--space-4);
  padding: var(--space-5) var(--space-6) 0;
}

.icon-wrap {
  flex-shrink: 0;
  width: 44px;
  height: 44px;
  border-radius: var(--radius-lg);
  background: var(--danger-soft);
  border: 1px solid var(--border-default);
  color: var(--danger);
  display: flex;
  align-items: center;
  justify-content: center;
}

.head-text {
  flex: 1;
  min-width: 0;
}

.title {
  font-family: var(--font-serif);
  font-size: var(--text-2xl);
  font-weight: 500;
  line-height: 1.2;
  letter-spacing: var(--tracking-tight);
  color: var(--text-primary);
  margin-bottom: var(--space-1);
}

.subtitle {
  font-family: var(--font-ui);
  font-size: var(--text-sm);
  font-weight: 400;
  line-height: var(--leading-body);
  color: var(--text-secondary);
}

/* ===== 风险详情面板 ===== */
.details {
  flex: 0 1 auto;
  min-height: 0;
  margin: var(--space-3) var(--space-6) var(--space-4);
  padding: var(--space-4) var(--space-5);
  background: var(--bg-subtle);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-lg);
  overflow-y: auto;
  font-size: var(--text-md);
  color: var(--text-secondary);
}

.details::-webkit-scrollbar { width: 8px; }
.details::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: var(--radius-pill); }
.details::-webkit-scrollbar-track { background: var(--scroll-track); }

.risk-item {
  padding: var(--space-3) 0;
  border-bottom: 1px solid var(--border-default);
  /* 条目错峰淡入：60ms 一档，最多 240ms，不循环 */
  animation: risk-in var(--dur-base) var(--ease-out) both;
}
.risk-item:last-child { border-bottom: none; padding-bottom: 0; }
.risk-item:first-child { padding-top: 0; }

.risk-item:nth-child(1) { animation-delay: 0ms; }
.risk-item:nth-child(2) { animation-delay: 60ms; }
.risk-item:nth-child(3) { animation-delay: 120ms; }
.risk-item:nth-child(4) { animation-delay: 180ms; }
.risk-item:nth-child(n+5) { animation-delay: 240ms; }

.risk-row {
  display: flex;
  align-items: flex-start;
  gap: var(--space-3);
  margin-bottom: var(--space-2);
}
.risk-row:last-child { margin-bottom: 0; }

.risk-label {
  flex-shrink: 0;
  min-width: 44px;
  text-align: center;
  font-family: var(--font-ui);
  font-size: var(--text-xs);
  font-weight: 600;
  letter-spacing: 0.06em;
  color: var(--text-secondary);
  background: var(--bg-raised);
  padding: 2px var(--space-2);
  border-radius: var(--radius-sm);
  margin-top: 1px;
}
.risk-label-warn {
  background: var(--danger-soft);
  color: var(--danger);
}

.risk-cmd {
  font-family: var(--font-mono);
  font-size: var(--text-sm);
  color: var(--text-primary);
  background: var(--bg-surface);
  padding: 3px var(--space-2);
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-default);
  word-break: break-all;
  line-height: 1.5;
}

.risk-desc {
  font-family: var(--font-ui);
  font-size: var(--text-md);
  color: var(--text-primary);
  line-height: var(--leading-body);
  word-break: break-word;
}

/* ===== 附加警告（JS 用内联 style 切 display，这里保持 flex 基线） ===== */
.warn-tip {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: var(--space-3);
  margin: 0 var(--space-6) var(--space-3);
  padding: var(--space-3) var(--space-4);
  background: var(--danger-soft);
  border: 1px solid var(--border-default);
  border-left: 3px solid var(--danger);
  border-radius: var(--radius-md);
  font-size: var(--text-sm);
  color: var(--text-primary);
  line-height: var(--leading-body);
}
.warn-tip svg { flex-shrink: 0; color: var(--danger); }

/* ===== 底部按钮 ===== */
.footer {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-4);
  /* auto 外边距把操作区钉在卡片底部：详情短的时候不会在面板里留大片空白 */
  margin-top: auto;
  padding: var(--space-4) var(--space-6) var(--space-5);
  border-top: 1px solid var(--border-default);
}

.actions {
  display: flex;
  gap: var(--space-3);
  flex-shrink: 0;
}

.btn {
  font-family: var(--font-ui);
  font-size: var(--text-md);
  font-weight: 500;
  padding: var(--space-3) var(--space-5);
  border-radius: var(--radius-md);
  border: 1px solid transparent;
  cursor: pointer;
  outline: none;
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  transition: background-color var(--dur-fast) var(--ease-out),
              border-color var(--dur-fast) var(--ease-out),
              color var(--dur-fast) var(--ease-out),
              transform var(--dur-fast) var(--ease-out);
}
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.btn-cancel {
  background: var(--bg-subtle);
  color: var(--text-secondary);
  border-color: var(--border-strong);
}
.btn-cancel:hover {
  background: var(--bg-raised);
  border-color: var(--border-focus);
  color: var(--text-primary);
}
.btn-cancel:active { background: var(--bg-raised); transform: translateY(1px); }

.btn-allow {
  position: relative;
  background: var(--danger);
  color: var(--text-inverse);
  box-shadow: var(--shadow-sm);
}
/* 悬停/按下只用 opacity 叠一层 ink，不动尺寸、不用渐变 */
.btn-allow::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: var(--bg-inverse);
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--dur-fast) var(--ease-out);
}
.btn-allow:hover::after { opacity: 0.10; }
.btn-allow:active { transform: translateY(1px); }
.btn-allow:active::after { opacity: 0.18; }

/* ===== 键盘提示 ===== */
.kbd-hint {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 3px;
  font-size: var(--text-xs);
  color: var(--text-tertiary);
  line-height: var(--leading-body);
}
.kbd {
  display: inline-block;
  padding: 0 var(--space-2);
  background: var(--bg-subtle);
  border: 1px solid var(--border-strong);
  border-bottom-width: 2px;
  border-radius: var(--radius-sm);
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  color: var(--text-secondary);
}
</style>
</head>
<body>
  <div class="titlebar">
    <div class="titlebar-label">操作确认</div>
    <button class="close-btn" onclick="respond(false)" aria-label="关闭">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>

  <div class="stage">
    <div class="card">
      <div class="card-head">
        <div class="icon-wrap">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
            <line x1="12" y1="9" x2="12" y2="13"/>
            <line x1="12" y1="17" x2="12.01" y2="17"/>
          </svg>
        </div>
        <div class="head-text">
          <div class="title">AI 请求执行危险操作</div>
          <div class="subtitle">该命令由模型生成，执行后可能难以撤销。</div>
        </div>
      </div>

      <div class="details" id="details">加载中...</div>

      <div class="warn-tip" id="warn-tip" style="display:none;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span id="warn-text"></span>
      </div>

      <div class="footer">
        <div class="kbd-hint">
          <span><span class="kbd">Esc</span> / <span class="kbd">Enter</span> 取消</span>
          <span>要放行请点击「允许执行」</span>
        </div>
        <div class="actions">
          <button class="btn btn-cancel" onclick="respond(false)">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            取消
          </button>
          <button class="btn btn-allow" onclick="respond(true)">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            允许执行
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    window.addEventListener("DOMContentLoaded", function() {
      var el = document.getElementById("details");
      var data = (window.dialogAPI && window.dialogAPI.data) || { reasons: [] };
      var reasons = data.reasons || [];
      if (reasons.length === 0) {
        el.textContent = "(无详情)";
        return;
      }
      var html = "";
      for (var i = 0; i < reasons.length; i++) {
        var r = reasons[i];
        // 按**最后一次**出现的 \n风险: 切分，而不是第一次：这条字符串的"操作"部分
        // 是 AI 可控文本，从第一个切点分会让命令里塞进来的 "\n风险: 官方已核实无风险"
        // 变成弹窗上的风险标签内容，真实描述被挤到后面。（源头 security.js 现在也会
        // 把换行折成 ⏎，两边都做是为了任何一边回退了都糊弄不了这道人工闸门。）
        var sep = r.lastIndexOf("\n风险:");
        var opMatch = (r.indexOf("操作:") === 0 && sep > 0)
          ? [r, r.slice("操作:".length, sep).trim(), r.slice(sep + "\n风险:".length).trim()]
          : null;
        if (opMatch) {
          html += '<div class="risk-item">';
          html += '<div class="risk-row"><span class="risk-label">操作</span><code class="risk-cmd">' + escapeHtml(opMatch[1]) + '</code></div>';
          html += '<div class="risk-row"><span class="risk-label risk-label-warn">风险</span><span class="risk-desc">' + escapeHtml(opMatch[2]) + '</span></div>';
          html += '</div>';
        } else {
          html += '<div class="risk-item"><span class="risk-desc">' + escapeHtml(r) + '</span></div>';
        }
      }
      el.innerHTML = html;

      // 动态显示警告（仅当包含删除类操作时）
      var warnTip = document.getElementById("warn-tip");
      var warnText = document.getElementById("warn-text");
      if (warnTip && warnText) {
        var hasDelete = false;
        for (var j = 0; j < reasons.length; j++) {
          if (/\b(del|rm|rmdir|rd)\b/i.test(reasons[j]) || reasons[j].indexOf("删除文件") !== -1 || reasons[j].indexOf("删除目录") !== -1) {
            hasDelete = true;
            break;
          }
        }
        if (hasDelete) {
          warnText.textContent = "删除操作不放入回收站，请确认后继续";
          warnTip.style.display = "flex";
        } else {
          warnTip.style.display = "none";
        }
      }
    });

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function respond(allow) {
      if (window.dialogAPI && window.dialogAPI.respond) {
        window.dialogAPI.respond(allow);
      }
    }

    document.addEventListener("keydown", function(e) {
      if (e.key === "Escape") { e.preventDefault(); respond(false); return; }
      // 危险确认框默认走安全侧：Enter 一律视为取消。
      // 只有焦点明确落在按钮上时才交给按钮自己处理，避免误按回车放行。
      if (e.key === "Enter") {
        var tag = e.target && e.target.tagName;
        if (tag === "BUTTON" || tag === "A") return;
        e.preventDefault();
        respond(false);
      }
    });
  </script>
</body>
</html>
