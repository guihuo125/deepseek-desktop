<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  background: #f3f4f6;
  user-select: none;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-bottom: 1px solid #e5e7eb;
}

.address-bar {
  height: 48px;
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 4px;
  background: #f3f4f6;
  -webkit-app-region: drag;
  flex-shrink: 0;
}

/* 左侧：纯净模式标签 */
.brand-label {
  -webkit-app-region: no-drag;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  font-weight: 700;
  color: #1f2937;
  letter-spacing: 0.3px;
  padding: 0 14px 0 4px;
  flex-shrink: 0;
  margin-right: 4px;
  position: relative;
}

.brand-icon {
  width: 22px;
  height: 22px;
  flex-shrink: 0;
  object-fit: contain;
}

/* 分割线已移除 */

/* 导航按钮 */
.nav-btn {
  -webkit-app-region: no-drag;
  width: 30px;
  height: 30px;
  border-radius: 6px;
  border: none;
  background: transparent;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #4b5563;
  transition: background 0.15s, color 0.15s;
  flex-shrink: 0;
}
.nav-btn:hover { background: rgba(0, 0, 0, 0.05); color: #111827; }
.nav-btn:active { background: rgba(0, 0, 0, 0.08); }
.nav-btn:disabled { opacity: 0.3; cursor: default; }
.nav-btn:disabled:hover { background: transparent; color: #4b5563; }

/* 地址栏（胶囊） */
.address-wrap {
  -webkit-app-region: no-drag;
  flex: 1;
  display: flex;
  align-items: center;
  height: 34px;
  padding: 0 14px;
  background: #ffffff;
  border: 1px solid #e5e7eb;
  border-radius: 17px;
  margin-left: 8px;
  min-width: 0;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.address-wrap:focus-within {
  border-color: #a5b4fc;
  box-shadow: 0 0 0 3px rgba(165, 180, 252, 0.18);
}

.lock-icon {
  flex-shrink: 0;
  margin-right: 8px;
  color: #10b981;
  display: flex;
  align-items: center;
}

.address-input {
  flex: 1;
  border: none;
  background: transparent;
  outline: none;
  font-size: 13px;
  font-family: inherit;
  color: #374151;
  padding: 0;
  min-width: 0;
  text-overflow: ellipsis;
  white-space: nowrap;
  overflow: hidden;
}

/* 状态点已彻底移除 */

@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.8); }
}
</style>
  <style>
    /* 绝对最高优先级：彻底干掉所有可能的背景和聚焦效果 */
    #workspace-btn, 
    #workspace-btn:hover, 
    #workspace-btn:active, 
    #workspace-btn:focus, 
    #workspace-btn.active,
    #workspace-btn * {
      background: transparent !important;
      background-color: transparent !important;
      background-image: none !important;
      box-shadow: none !important;
      outline: none !important;
      border-color: transparent !important;
      -webkit-tap-highlight-color: transparent !important;
    }
    
    /* 干掉浏览器的默认焦点/选中高亮 */
    #workspace-btn::selection, #workspace-btn *::selection {
      background: transparent !important;
    }
  </style>
</head>
<body>
  <div class="address-bar">
    <style>
      /* 覆盖并美化工作区按钮 */
      #workspace-btn, #workspace-btn.active {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 8px 4px 4px;
        border-radius: 6px;
        cursor: pointer;
        transition: opacity 0.2s;
        -webkit-app-region: no-drag;
        font-weight: 600;
        background: transparent !important;
        background-color: transparent !important;
        box-shadow: none !important;
        border: none !important;
      }
      #workspace-btn:hover {
        opacity: 1;
        background: transparent !important;
      }
      #workspace-btn:active {
        opacity: 1;
        background: transparent !important;
      }
      #workspace-btn.active {
        background: transparent !important;
      }
      #workspace-btn.active #workspace-text {
        color: #1f2937; /* 保持墨黑色 */
      }
      #workspace-btn .arrow-icon {
        transition: transform 0.2s;
      }
      #workspace-btn:hover .arrow-icon {
        transform: translateY(1px);
      }
    </style>

    <div class="brand-label" id="workspace-btn" title="点击选择项目文件夹">
      <!-- DeepSeek 蓝文件夹图标（带底层半透明填充） -->
      <svg class="brand-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M2 6C2 4.89543 2.89543 4 4 4H9L11 6H20C21.1046 6 22 6.89543 22 8V18C22 19.1046 21.1046 20 20 20H4C2.89543 20 2 19.1046 2 18V6Z" fill="#4D6BFE" fill-opacity="0.12"/>
        <path d="M2 6C2 4.89543 2.89543 4 4 4H9L11 6H20C21.1046 6 22 6.89543 22 8V18C22 19.1046 21.1046 20 20 20H4C2.89543 20 2 19.1046 2 18V6Z" stroke="#4D6BFE" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M2 9H22" stroke="#4D6BFE" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.5"/>
      </svg>
      <span id="workspace-text" style="font-size: 13px; font-weight: 600; color: #1f2937;">选择工作区</span>
      <!-- 下拉小箭头 -->
      <svg class="arrow-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#4b5563" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </div>

    <button class="nav-btn" id="btn-back" title="后退" disabled>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <button class="nav-btn" id="btn-forward" title="前进" disabled>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
    <button class="nav-btn" id="btn-reload" title="刷新">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
    </button>

    <div class="address-wrap">
      <div class="lock-icon">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <input class="address-input" id="address-input" type="text" readonly value="加载中...">
    </div>

    <!-- 状态指示灯已移除 -->
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    function updateNav(canGoBack, canGoForward) {
      $("btn-back").disabled = !canGoBack;
      $("btn-forward").disabled = !canGoForward;
    }

    function updateAddress(url) {
      $("address-input").value = url || "";
    }

    function updateStatus(state) {
      // 无操作
    }

    $("btn-back").onclick = () => window.shellAPI.back();
    $("btn-forward").onclick = () => window.shellAPI.forward();
    $("btn-reload").onclick = () => window.shellAPI.reload();

    window.shellAPI.onStateChange(function(state) {
      if (state.url !== undefined) updateAddress(state.url);
      if (state.canGoBack !== undefined || state.canGoForward !== undefined) {
        updateNav(!!state.canGoBack, !!state.canGoForward);
      }
      if (state.status) updateStatus(state.status);
    });

    // ============ 工作区逻辑 ============
    async function updateWorkspace() {
      const textEl = $("workspace-text");
      const btnEl = $("workspace-btn");
      try {
        const res = await window.shellAPI.getWorkspace();
        // 无论选没选，都强行清空背景和样式，保持透明
        btnEl.style.background = "";
        btnEl.style.borderRadius = "";

        if (res && res.path) {
          // 只截取路径的最后一截（文件夹名）
          const folderName = res.path.split(/[\\/]/).filter(Boolean).pop() || res.path;
          textEl.textContent = folderName;
          btnEl.title = "当前工作区: " + res.path + "\n点击更换";
        } else {
          textEl.textContent = "选择工作区";
          btnEl.title = "点击选择项目文件夹";
        }
      } catch (e) {}
    }

    $("workspace-btn").onclick = async () => {
      try {
        await window.shellAPI.selectWorkspace();
        await updateWorkspace();
      } catch (e) {
        // 忽略异常，保持原样
      }
    };

    // 初始化加载
    updateWorkspace();
  </script>
</body>
</html>
